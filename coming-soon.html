<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultimate Battle — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --yellow: #FFD200;
      --orange: #FF8C00;
      --navy: #1A1F5E;
      --black: #07080F;
      --white: #F5F5F0;
    }

    html,
    body {
      height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: 'Barlow', sans-serif;
      overflow-x: hidden;
    }

    /* ---- NOISE OVERLAY ---- */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.04;
      pointer-events: none;
      z-index: 999;
    }

    /* ---- BACKGROUND ---- */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.18;
    }

    .bg-glow-1 {
      width: 700px;
      height: 700px;
      background: var(--yellow);
      top: -200px;
      left: -200px;
      animation: pulse1 8s ease-in-out infinite alternate;
    }

    .bg-glow-2 {
      width: 500px;
      height: 500px;
      background: var(--orange);
      bottom: -150px;
      right: -100px;
      animation: pulse2 10s ease-in-out infinite alternate;
    }

    .bg-glow-3 {
      width: 300px;
      height: 300px;
      background: var(--navy);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.4;
      filter: blur(80px);
    }

    @keyframes pulse1 {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.15) translate(30px, 20px);
      }
    }

    @keyframes pulse2 {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.2) translate(-20px, -30px);
      }
    }

    /* ---- GRID LINES ---- */
    .grid-lines {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 210, 0, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 210, 0, 0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 1;
      pointer-events: none;
    }

    /* ---- LAYOUT ---- */
    .page {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }

    /* ---- LOGO ---- */
    .logo-wrap {
      margin-bottom: 32px;
      animation: fadeDown 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .logo-wrap img {
      width: min(150px, 80vw);
      filter: drop-shadow(0 0 40px rgba(255, 210, 0, 0.35));
      transition: filter 0.3s;
    }

    .logo-wrap img:hover {
      filter: drop-shadow(0 0 60px rgba(255, 140, 0, 0.6));
    }

    /* ---- HEADLINE ---- */
    .headline {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(52px, 12vw, 120px);
      line-height: 0.9;
      letter-spacing: 0.02em;
      background: linear-gradient(135deg, var(--yellow) 0%, var(--orange) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeUp 0.8s 0.15s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .sub-headline {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: clamp(14px, 2.5vw, 20px);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(245, 245, 240, 0.55);
      margin-top: 12px;
      animation: fadeUp 0.8s 0.25s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* ---- DIVIDER ---- */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 36px 0;
      width: min(400px, 90vw);
      animation: fadeUp 0.8s 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 210, 0, 0.4), transparent);
    }

    .divider-dot {
      width: 6px;
      height: 6px;
      background: var(--yellow);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--yellow);
    }

    /* ---- COUNTDOWN ---- */
    .countdown-wrap {
      animation: fadeUp 0.8s 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .countdown-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(245, 245, 240, 0.4);
      margin-bottom: 16px;
    }

    .countdown {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .cd-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 72px;
    }

    .cd-number {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(38px, 8vw, 64px);
      line-height: 1;
      background: linear-gradient(160deg, var(--yellow), var(--orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
    }

    .cd-number::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 1px;
      background: rgba(255, 210, 0, 0.3);
    }

    .cd-unit {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(245, 245, 240, 0.35);
      margin-top: 8px;
    }

    .cd-sep {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(30px, 6vw, 50px);
      color: rgba(255, 210, 0, 0.3);
      align-self: flex-start;
      margin-top: 4px;
    }

    /* ---- SOCIALS ---- */
    .socials-wrap {
      margin-top: 44px;
      animation: fadeUp 0.8s 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .socials-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(245, 245, 240, 0.3);
      margin-bottom: 18px;
    }

    .socials {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .social-link {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 18px;
      border: 1px solid rgba(255, 210, 0, 0.15);
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(6px);
      text-decoration: none;
      color: rgba(245, 245, 240, 0.7);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      transition: all 0.25s;
      position: relative;
      overflow: hidden;
    }

    .social-link::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 210, 0, 0.08), rgba(255, 140, 0, 0.08));
      opacity: 0;
      transition: opacity 0.25s;
    }

    .social-link:hover {
      border-color: rgba(255, 210, 0, 0.5);
      color: var(--white);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 210, 0, 0.1);
    }

    .social-link:hover::before {
      opacity: 1;
    }

    .social-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* ---- FOOTER ---- */
    .footer {
      margin-top: 56px;
      font-size: 12px;
      color: rgba(245, 245, 240, 0.2);
      letter-spacing: 0.1em;
      animation: fadeUp 0.8s 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* ---- CORNER ACCENTS ---- */
    .corner {
      position: fixed;
      width: 60px;
      height: 60px;
      z-index: 5;
      pointer-events: none;
    }

    .corner-tl {
      top: 20px;
      left: 20px;
      border-top: 2px solid rgba(255, 210, 0, 0.25);
      border-left: 2px solid rgba(255, 210, 0, 0.25);
    }

    .corner-tr {
      top: 20px;
      right: 20px;
      border-top: 2px solid rgba(255, 210, 0, 0.25);
      border-right: 2px solid rgba(255, 210, 0, 0.25);
    }

    .corner-bl {
      bottom: 20px;
      left: 20px;
      border-bottom: 2px solid rgba(255, 210, 0, 0.25);
      border-left: 2px solid rgba(255, 210, 0, 0.25);
    }

    .corner-br {
      bottom: 20px;
      right: 20px;
      border-bottom: 2px solid rgba(255, 210, 0, 0.25);
      border-right: 2px solid rgba(255, 210, 0, 0.25);
    }

    /* ---- ANIMATIONS ---- */
    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ---- RESPONSIVE ---- */
    @media (max-width: 480px) {
      .cd-block {
        min-width: 58px;
      }

      .social-link {
        padding: 9px 14px;
        font-size: 12px;
      }

      .corner {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>

<body>

  <!-- Background -->
  <div class="bg">
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>
  </div>
  <div class="grid-lines"></div>

  <!-- Corner accents -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- Page content -->
  <main class="page">

    <div class="logo-wrap">
      <img src="{{LOGO_URL}}" alt="Ultimate Battle" />
    </div>

    <h1 class="headline">Coming Soon</h1>
    <p class="sub-headline">The Ultimate Gaming Experience Awaits</p>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-dot"></div>
      <div class="divider-line"></div>
    </div>

    <!-- Countdown -->
    <div class="countdown-wrap">
      <p class="countdown-label">Launching In</p>
      <div class="countdown">
        <div class="cd-block">
          <span class="cd-number" id="cd-days">00</span>
          <span class="cd-unit">Days</span>
        </div>
        <span class="cd-sep">:</span>
        <div class="cd-block">
          <span class="cd-number" id="cd-hours">00</span>
          <span class="cd-unit">Hours</span>
        </div>
        <span class="cd-sep">:</span>
        <div class="cd-block">
          <span class="cd-number" id="cd-mins">00</span>
          <span class="cd-unit">Mins</span>
        </div>
        <span class="cd-sep">:</span>
        <div class="cd-block">
          <span class="cd-number" id="cd-secs">00</span>
          <span class="cd-unit">Secs</span>
        </div>
      </div>
    </div>

    <!-- Socials -->
    <div class="socials-wrap">
      <p class="socials-label">Follow the Battle</p>
      <div class="socials">

        <!-- YouTube -->
        <a href="https://youtube.com/@ultimatebattleGG" target="_blank" rel="noopener" class="social-link">
          <svg class="social-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46A2.78 2.78 0 0 0 1.46 6.42 29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58 2.78 2.78 0 0 0 1.95 1.96C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.96A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"
              fill="rgba(255,210,0,0.7)" />
            <polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="#07080F" />
          </svg>
          @ultimatebattleGG
        </a>

        <!-- X / Twitter -->
        <a href="https://x.com/followultbattle" target="_blank" rel="noopener" class="social-link">
          <svg class="social-icon" viewBox="0 0 24 24" fill="rgba(255,210,0,0.7)" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.261 5.632zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
          </svg>
          @followultbattle
        </a>

        <!-- TikTok -->
        <a href="https://tiktok.com/@followultbattle" target="_blank" rel="noopener" class="social-link">
          <svg class="social-icon" viewBox="0 0 24 24" fill="rgba(255,210,0,0.7)" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.89a8.18 8.18 0 0 0 4.78 1.52V6.97a4.85 4.85 0 0 1-1.01-.28z" />
          </svg>
          @followultbattle
        </a>

        <!-- Instagram -->
        <a href="https://instagram.com/ultimatebattle" target="_blank" rel="noopener" class="social-link">
          <svg class="social-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5" stroke="rgba(255,210,0,0.7)" stroke-width="2" />
            <circle cx="12" cy="12" r="4" stroke="rgba(255,210,0,0.7)" stroke-width="2" />
            <circle cx="17.5" cy="6.5" r="1" fill="rgba(255,210,0,0.7)" />
          </svg>
          @ultimatebattle
        </a>

      </div>
    </div>

    <p class="footer">&copy; 2026 Ultimate Battle. All rights reserved.</p>

  </main>

  <script>
    // Countdown — set your launch date here
    const LAUNCH = new Date('{{LAUNCH_DATE}}').getTime();

    function tick() {
      const now = Date.now();
      const diff = LAUNCH - now;

      if (diff <= 0) {
        document.getElementById('cd-days').textContent = '00';
        document.getElementById('cd-hours').textContent = '00';
        document.getElementById('cd-mins').textContent = '00';
        document.getElementById('cd-secs').textContent = '00';
        return;
      }

      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);

      const fmt = n => String(n).padStart(2, '0');
      document.getElementById('cd-days').textContent = fmt(d);
      document.getElementById('cd-hours').textContent = fmt(h);
      document.getElementById('cd-mins').textContent = fmt(m);
      document.getElementById('cd-secs').textContent = fmt(s);
    }

    tick();
    setInterval(tick, 1000);
  </script>

</body>

</html>
